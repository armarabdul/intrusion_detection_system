<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Network Intrusion Detection System{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
    <link rel="alternate icon" href="{{ url_for('static', filename='images/favicon.svg') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'cyber-emerald': '#10b981',
                        'cyber-cyan': '#06b6d4',
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for dark theme */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(51, 65, 85, 0.3);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.5);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(100, 116, 139, 0.7);
        }
        /* Firefox */
        .custom-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: rgba(100, 116, 139, 0.5) rgba(51, 65, 85, 0.3);
        }
    </style>
</head>
<body class="bg-slate-900 text-gray-100 flex flex-col min-h-screen">
    {% block content %}{% endblock %}
    
    <footer class="bg-slate-800/80 backdrop-blur-xl border-t border-slate-700/50 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div>
                    <h3 class="text-lg font-bold text-white mb-3">Network IDS</h3>
                    <p class="text-sm text-slate-400">Anomaly-based intrusion detection system with machine learning architecture</p>
                </div>
                <div>
                    <h4 class="text-sm font-semibold text-slate-300 mb-3">Links</h4>
                    <div class="flex space-x-4">
                        <a href="https://github.com/armarabdul" target="_blank" class="text-slate-400 hover:text-cyber-cyan transition">

                    <h4 class="text-sm font-semibold text-slate-300 mb-3">Credits</h4>

                        Developed during internship at <a href="https://zevello.co" target="_blank" class="text-cyber-cyan hover:underline">Zevello Technologies</a>

</html>
